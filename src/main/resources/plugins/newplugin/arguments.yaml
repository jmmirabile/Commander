# New Plugin Generator CLI Arguments
config:
  help_text_file:1 "/plugins/newplugin/help.txt"

options:
  - name: help
    short: h
    description: "Display help information"
    required: false
    hasArg: false

  - name: package
    short: p
    description: "Java package name for the plugin"
    required: false
    hasArg: true
    argHelpLabel: "package"